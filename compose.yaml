services:
  switchboard:
    image: switchboard-ai-router:${SWITCHBOARD_VERSION:-2.0.14}
    build:
      context: .
      args:
        VERSION: ${SWITCHBOARD_VERSION:-2.0.14}
        REVISION: ${SWITCHBOARD_REVISION:-local}
    container_name: switchboard-ai-router
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
