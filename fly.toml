# fly launch --no-deploy 会为你的账号配置唯一应用名。
primary_region = "sin"
[build]
  dockerfile = "Dockerfile"
[env]
  COOKIE_SECURE = "true"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATA_DIR = "/app/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"
[[mounts]]
  source = "router_data"
  destination = "/app/data"
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
