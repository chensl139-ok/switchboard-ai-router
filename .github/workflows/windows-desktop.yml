name: Windows desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          architecture: x64
          cache: npm
      - name: Install and test
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified build and test prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          $innoInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $innoInstaller
          if ((Get-FileHash $innoInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup checksum mismatch' }
          $signature = Get-AuthenticodeSignature $innoInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Invalid Inno Setup signature' }
          $innoDir = Join-Path $env:RUNNER_TEMP 'switchboard-inno'
          $setup = Start-Process $innoInstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $innoDir + '"') -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Could not install the verified Inno compiler' }
          $compiler = Join-Path $innoDir 'ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno compiler missing' }
          "SWITCHBOARD_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The ephemeral CI runner explicitly installs Microsoft's signed runtime for the UI test.
          # The shipped installer never downloads or installs it without the end user's action.
          function Has-WebView2 {
            foreach ($key in @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')) {
              $version = (Get-ItemProperty $key -Name pv -ErrorAction SilentlyContinue).pv
              if ($version -and $version -ne '0.0.0.0') { return $true }
            }
            return $false
          }
          if (!(Has-WebView2)) {
            $webview = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview
            $signature = Get-AuthenticodeSignature $webview
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft WebView2 signature' }
            $setup = Start-Process $webview -ArgumentList '/silent', '/install' -Wait -PassThru
            if (!(Has-WebView2)) { throw "WebView2 unavailable after install: $($setup.ExitCode)" }
          }
      - name: Build clean Windows package
        run: npm run build:windows
      - name: Smoke test the packaged Node service
        run: |
          & 'dist/windows/app/resources/runtime/node.exe' 'scripts/smoke-windows-runtime.mjs' 'dist/windows/app'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, launch native WebView2 and uninstall
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-windows-installer.ps1 -Installer "$env:GITHUB_WORKSPACE/dist/windows/Switchboard-$version-Windows-x64-Setup.exe"
      - name: Verify distributable checksums
        run: |
          Get-Content 'dist/windows/SHA256SUMS' | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $actual = (Get-FileHash (Join-Path 'dist/windows' $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
          }
      - name: Upload Windows installer and sharing ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Switchboard-Windows-x64
          path: |
            dist/windows/*-Windows-x64-Setup.exe
            dist/windows/*-Windows-x64.zip
            dist/windows/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Upload isolated validation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Windows-desktop-validation
          path: dist/windows/validation/
          retention-days: 14
          if-no-files-found: ignore
