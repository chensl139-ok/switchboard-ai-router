name: Switchboard Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build release archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix=switchboard-ai-router-${GITHUB_REF_NAME}/ --output=switchboard-ai-router-${GITHUB_REF_NAME}.zip HEAD
          git archive --format=tar.gz --prefix=switchboard-ai-router-${GITHUB_REF_NAME}/ --output=switchboard-ai-router-${GITHUB_REF_NAME}.tar.gz HEAD
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$GITHUB_REF_NAME" --build-arg REVISION="$GITHUB_SHA" -t switchboard-ai-router:"$version" --output type=oci,dest=switchboard-ai-router-${GITHUB_REF_NAME}-oci.tar .
          gzip -9 switchboard-ai-router-${GITHUB_REF_NAME}-oci.tar
          sha256sum switchboard-ai-router-${GITHUB_REF_NAME}.zip switchboard-ai-router-${GITHUB_REF_NAME}.tar.gz switchboard-ai-router-${GITHUB_REF_NAME}-oci.tar.gz > SHA256SUMS
          awk -v heading="## [$version]" '$0 == heading { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > RELEASE_NOTES.md
      - name: Publish GitHub Release
        run: |
          assets=(
            "switchboard-ai-router-${GITHUB_REF_NAME}.zip"
            "switchboard-ai-router-${GITHUB_REF_NAME}.tar.gz"
            "switchboard-ai-router-${GITHUB_REF_NAME}-oci.tar.gz"
            "SHA256SUMS"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Switchboard $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Switchboard $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${assets[@]}"
          fi
