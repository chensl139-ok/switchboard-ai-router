<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switchboard · 智能路由</title><link rel="stylesheet" href="/style.css"></head><body>
<aside><a class="brand" href="/">▧ <span>Switchboard<small>AI 智能路由平台</small></span></a><div class="nav-label">工作空间</div><nav><button class="selected" data-tab="overview">◈　路由控制台</button><button data-tab="providers">▦　服务商管理</button><button data-tab="playground">⌘　模型实验室</button><button data-tab="logs">≡　请求日志</button><button data-tab="api">〈〉 API 接入</button></nav><div class="aside-bottom"><span class="dot"></span> 自托管 · 数据由你掌控<small>SWITCHBOARD / V1.0</small></div></aside>
<main><header><span>工作空间 <b>/</b> <span id="breadcrumb">路由控制台</span></span><button id="logout" class="subtle">退出登录 ↗</button></header><section id="content"></section><footer>一个入口，连接模型世界。<span>OpenAI-compatible gateway</span></footer></main>
<dialog id="login"><form id="login-form"><div class="eyebrow">WELCOME TO SWITCHBOARD</div><h2>连接你的 AI 工作空间</h2><p>输入服务器配置的管理令牌，开始管理模型路由。</p><label>管理令牌<input id="token" type="password" required autocomplete="current-password" placeholder="ADMIN_TOKEN"></label><button class="primary">进入控制台 →</button><p id="login-error" role="alert"></p></form></dialog>
<dialog id="edit"><form id="provider-form"><div class="modal-title"><h2>配置服务商</h2><button type="button" id="close-edit" class="subtle">✕</button></div><div class="form-grid"><label>路由 ID<input name="id" required pattern="[a-z0-9-]{1,40}" placeholder="my-provider"></label><label>显示名称<input name="name" required maxlength="60"></label></div><label>协议<select name="protocol"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic Messages</option></select></label><label>Base URL<input name="baseUrl" required type="url" placeholder="https://api.example.com/v1"></label><label>模型 ID<input name="model" placeholder="从列表选择，或手动输入模型 ID"></label><label>可切换模型（每行一个 ID）<textarea name="models" rows="3" placeholder="可从下方模型列表逐个添加，也可手动输入多个模型 ID"></textarea></label><label>API Key<input name="apiKey" type="password" autocomplete="new-password" placeholder="留空保留已有密钥"></label><div class="model-picker"><button type="button" id="fetch-models">↻ 获取所有模型</button><p id="model-status" role="status">填写 API Key 后获取此账户可见的模型。</p><label>搜索模型<input id="model-search" type="search" placeholder="输入模型名称或 ID" disabled></label><div id="model-results" class="model-results"></div><small class="muted">列表可能包含嵌入、图像等模型；当前聊天接口仅支持文本对话模型。</small></div><div class="form-grid"><label>回退优先级（数字越小越优先）<input name="priority" type="number" min="0" max="100" value="50"></label><label class="check"><input name="enabled" type="checkbox"> 启用此路由</label></div><label class="check"><input name="clearKey" type="checkbox"> 清除已保存密钥（同时关闭启用）</label><p class="muted">密钥在服务器使用 AES-256-GCM 加密保存，不会回传到浏览器。</p><button class="primary">保存配置</button><p id="edit-error" role="alert"></p></form></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
