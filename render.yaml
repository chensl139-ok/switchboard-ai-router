services:
  - type: web
    name: switchboard-ai-router
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: router-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GATEWAY_TOKEN
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '3000'
      - key: DATA_DIR
        value: /app/data
